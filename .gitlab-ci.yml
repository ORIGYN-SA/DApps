default:
  image: registry.bochslerfinance.com/runners-images/dfinity-canisters:0.22.0@sha256:11730bea35bb5b41aaec9c600a6b7ac837188d21d8d9ce97f781a7b74ad1fd01
  interruptible: true
  before_script:
    - dfx --version
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - unknown_failure

cache:
  - key: 'dfx-$CI_COMMIT_REF_SLUG'
    paths:
      - .dfx

stages:
  - lint
  - build
  - deploy

.node template:
  image: node:18
  cache:
    - key: 'node-$CI_COMMIT_REF_SLUG'
      paths:
        - .npm/
        - node_modules/
        - ./**/.npm/
        - ./**/node_modules/
  before_script:
    - npm ci --cache .npm --prefer-offline

.import dfx identity:
  before_script:
    - echo "Loading identity for network" $TARGET_NETWORK
    - dfx --version
    - dfx identity import --storage-mode plaintext gitlab-ci-gldt $PEM_FILE
    - dfx identity use gitlab-ci-gldt
    - dfx identity whoami
    - dfx identity get-principal

global linter:
  stage: lint
  rules:
  extends: .node template
  script:
    - npm run lint

explorer staging build:
  stage: build
  rules:
    - if: ($CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME == "develop") || ($CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop")
  extends: .node template
  variables:
    CANISTER_NAME: 'explorer'
    NETWORK: 'staging'
    ENV: 'staging'
  script:
    - VERSION_STRING="${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    - ENV=$ENV VERSION=$VERSION_STRING npm run build:explorer_staging
    - STAGING_URL=$(CAN=$CANISTER_NAME NET=$NETWORK node -e 'const ids=require("./canister_ids.json"); console.log(`https://${ids[process.env.CAN][process.env.NET]}.icp0.io`);')
    - echo "$(echo 'explorer' | tr '[:lower:]' '[:upper:]')_URL=$STAGING_URL" > explorer_deploy.env
  artifacts:
    name: '${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}-explorer_STAGING_BUILD'
    paths:
      - client/explorer/dist
    reports:
      dotenv: explorer_deploy.env
    expire_in: 1 day
  environment:
    name: explorer frontend app
    deployment_tier: staging
    action: prepare

explorer preprod build:
  stage: build
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
  extends: .node template
  variables:
    CANISTER_NAME: 'explorer'
    NETWORK: 'preprod'
    ENV: 'preprod'
  script:
    - VERSION_STRING="${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    - ENV=$ENV VERSION=$VERSION_STRING npm run build:explorer_preprod
    - PREPROD_URL=$(CAN=$CANISTER_NAME NET=$NETWORK node -e 'const ids=require("./canister_ids.json"); console.log(`https://${ids[process.env.CAN][process.env.NET]}.icp0.io`);')
    - echo "$(echo 'explorer' | tr '[:lower:]' '[:upper:]')_URL=$PREPROD_URL" > explorer_deploy.env
  artifacts:
    name: '${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}-explorer_PREPROD_BUILD'
    paths:
      - client/explorer/dist
    reports:
      dotenv: explorer_deploy.env
    expire_in: 1 day
  environment:
    name: explorer frontend app preprod
    deployment_tier: staging
    action: prepare

explorer production build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ '/^explorer-v\d+\.\d+\.\d+$/'
    - if: $CI_COMMIT_REF_NAME == "master"
  extends: .node template
  variables:
    CANISTER_NAME: 'explorer'
    NETWORK: 'ic'
    ENV: 'prod'
  script:
    - VERSION_STRING="${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}"
    - ENV=$ENV VERSION=$VERSION_STRING npm run build:explorer_production
    - PRODUCTION_URL=$(CAN=$CANISTER_NAME NET=$NETWORK node -e 'const ids=require("./canister_ids.json"); console.log(`https://${ids[process.env.CAN][process.env.NET]}.icp0.io`);')
    - echo "$(echo 'explorer' | tr '[:lower:]' '[:upper:]')_URL=$PRODUCTION_URL" > explorer_deploy.env
  artifacts:
    name: '${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-explorer'
    paths:
      - client/explorer/dist
    reports:
      dotenv: explorer_deploy.env
    expire_in: 6 months
  environment:
    name: explorer frontend app
    deployment_tier: production
    action: prepare

.staging deploy template:
  stage: deploy
  resource_group: frontend staging deployment
  variables:
    PEM_FILE: '${PEM_FILE_STAGING}'
  before_script:
    - !reference [.import dfx identity, before_script]

explorer staging deploy:
  extends: .staging deploy template
  variables:
    TARGET_NETWORK: staging
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop"
      when: manual
      allow_failure: true
  needs: ['explorer staging build']
  script:
    - dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y explorer
  environment:
    name: explorer frontend
    deployment_tier: staging
    action: start

explorer preprod deploy:
  extends: .staging deploy template
  variables:
    TARGET_NETWORK: preprod
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
  needs: ['explorer preprod build']
  script:
    - dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y explorer
  environment:
    name: explorer frontend
    deployment_tier: testing
    action: start

# PRODUCTION DEPLOYMENT

explorer production deploy:
  stage: deploy
  resource_group: frontend production deployment
  variables:
    PEM_FILE: '${PEM_FILE_PRODUCTION}'
    TARGET_NETWORK: ic
  needs: ['explorer production build']
  rules:
    - if: $CI_COMMIT_TAG =~ '/^explorer-v\d+\.\d+\.\d+$/'
      when: manual
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y explorer
  environment:
    name: explorer frontend
    deployment_tier: production
    action: start
